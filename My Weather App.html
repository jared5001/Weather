<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#03050f;--bg2:#060d1f;
  --text:#e0f0ff;--dim:#5a7a9a;
  --card:rgba(0,200,255,0.04);--bdr:rgba(0,200,255,0.15);
  --cyan:#00d4ff;--cyan2:#00aacc;--purple:#7c3aed;--purple2:#a855f7;
  --green:#00ff9d;--red:#ff3366;
  --glow:rgba(0,212,255,0.18);--glow2:rgba(124,58,237,0.2);
  --mono:'JetBrains Mono',monospace;
}
body.light{
  --bg:#eaf6ff;--bg2:#d0ebff;--text:#071a2e;--dim:#4a6a8a;
  --card:rgba(0,100,180,0.06);--bdr:rgba(0,100,180,0.2);
  --glow:rgba(0,100,180,0.12);--glow2:rgba(100,40,200,0.1);
}

/* scanline texture overlay */
body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,212,255,0.015) 2px,rgba(0,212,255,0.015) 4px);pointer-events:none;z-index:9999}

body{
  font-family:'Inter',sans-serif;
  background:radial-gradient(ellipse at 20% 0%,#0a1a3a 0%,#03050f 55%),
             radial-gradient(ellipse at 80% 100%,#130a2a 0%,transparent 60%);
  background-color:var(--bg);
  color:var(--text);min-height:100vh;padding:20px;transition:background .3s,color .3s
}
body.light{background:linear-gradient(145deg,var(--bg),var(--bg2))}
.wrap{max-width:660px;margin:0 auto}

/* HEADER */
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:10px;flex-wrap:nowrap}
h1{
  font-size:1.5rem;font-weight:600;min-width:0;letter-spacing:.18em;text-transform:uppercase;
  background:linear-gradient(90deg,var(--cyan),var(--purple2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 8px rgba(0,212,255,.4))
}
.hrow{display:flex;gap:7px;align-items:center;flex-shrink:0}
#refresh-cd{font-size:.6rem;font-family:var(--mono);opacity:.3;letter-spacing:.05em;color:var(--cyan);white-space:nowrap;transition:opacity .4s}
#refresh-cd.soon{opacity:.8}
.ib{
  background:var(--card);border:1px solid var(--bdr);color:var(--text);
  width:40px;height:40px;border-radius:8px;cursor:pointer;font-size:1.1rem;
  display:flex;align-items:center;justify-content:center;transition:.2s;
  box-shadow:0 0 0 0 var(--glow);backdrop-filter:blur(8px)
}
.ib:hover{border-color:var(--cyan);box-shadow:0 0 12px var(--glow),inset 0 0 8px var(--glow);transform:translateY(-1px)}
.ib:active{transform:scale(.93)}

/* SEARCH */
.srow{position:relative;display:flex;gap:8px;margin-bottom:14px}
.srow input{
  flex:1;padding:11px 18px;background:var(--card);border:1px solid var(--bdr);
  border-radius:6px;color:var(--text);font-size:.95rem;outline:none;transition:.2s;
  backdrop-filter:blur(8px);font-family:'Inter',sans-serif;letter-spacing:.02em
}
.srow input::placeholder{color:var(--dim)}
.srow input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,212,255,.12),0 0 16px rgba(0,212,255,.1)}
#sdrop{
  position:absolute;top:calc(100% + 6px);left:0;right:52px;
  background:rgba(3,10,25,.95);border:1px solid var(--bdr);border-radius:10px;
  max-height:270px;overflow-y:auto;z-index:99;
  box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 20px var(--glow);display:none;
  backdrop-filter:blur(16px)
}
.si{padding:11px 15px;cursor:pointer;border-bottom:1px solid var(--bdr);font-size:.9rem;transition:.15s}
.si:last-child{border-bottom:none}
.si:hover{background:rgba(0,212,255,.07);color:var(--cyan)}
.si small{opacity:.5;font-size:.78rem;font-family:var(--mono)}

/* CHIPS */
.chips{display:flex;gap:8px;overflow-x:auto;padding:3px 0 12px;scrollbar-width:thin}
.chip{
  background:var(--card);border:1px solid var(--bdr);border-radius:4px;
  padding:5px 12px;white-space:nowrap;cursor:pointer;font-size:.82rem;
  display:flex;align-items:center;gap:5px;flex-shrink:0;transition:.2s;
  letter-spacing:.04em;text-transform:uppercase
}
.chip:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 8px var(--glow)}
.chip.on{background:rgba(0,212,255,.12);border-color:var(--cyan);color:var(--cyan)}
.xbtn{opacity:.4;margin-left:3px}
.xbtn:hover{opacity:1;color:var(--red)}

/* CURRENT */
.cur{
  border-radius:12px;padding:32px 24px 22px;text-align:center;margin-bottom:24px;
  position:relative;overflow:hidden;
  border:1px solid var(--bdr);backdrop-filter:blur(12px);
  transition:background .8s ease, border-color .8s ease, box-shadow .8s ease;
  box-shadow:0 0 40px var(--glow),0 0 80px var(--glow2),inset 0 1px 0 rgba(255,255,255,.08)
}
.cur::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,212,255,.06) 0%,transparent 50%,rgba(124,58,237,.06) 100%);
  pointer-events:none
}
/* corner accents */
.cur::after{
  content:"";position:absolute;top:0;left:0;width:32px;height:32px;
  border-top:2px solid var(--cyan);border-left:2px solid var(--cyan);
  border-radius:2px 0 0 0;opacity:.7
}

.cur h2{
  font-size:5.5rem;font-weight:300;line-height:1;animation:pop .5s ease;
  font-family:var(--mono);letter-spacing:-.02em;
  text-shadow:0 0 20px rgba(255,255,255,.15);
}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(10px)}to{opacity:1;transform:none}}
.cloc{font-size:1rem;margin:9px 0 12px;display:flex;align-items:center;justify-content:center;gap:9px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.star{cursor:pointer;font-size:1.1rem;transition:.2s;filter:drop-shadow(0 0 4px gold)}
.star:hover{transform:scale(1.3)}
.cdesc{font-size:1.1rem;margin:5px 0;letter-spacing:.04em}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:16px}
.cgi{
  background:rgba(0,212,255,.05);padding:10px 8px;border-radius:8px;font-size:.78rem;
  border:1px solid rgba(0,212,255,.1);letter-spacing:.04em;text-transform:uppercase;
  transition:.2s;
}
.cgi:hover{border-color:var(--cyan);box-shadow:0 0 10px var(--glow)}
.cgi strong{display:block;font-size:.95rem;margin-top:4px;font-family:var(--mono);color:var(--cyan);letter-spacing:.02em}
.sunrow{
  font-size:.82rem;opacity:.65;margin-top:13px;letter-spacing:.08em;font-family:var(--mono)
}

/* SECTIONS */
section{margin-bottom:26px}
h2.sh{
  font-size:.75rem;opacity:.5;font-weight:600;margin-bottom:12px;
  letter-spacing:.2em;text-transform:uppercase;
  display:flex;align-items:center;gap:8px
}
h2.sh::before{content:"";display:inline-block;width:16px;height:1px;background:var(--cyan);opacity:.7}
.scroll{display:flex;gap:10px;overflow-x:auto;padding:5px 0 8px;scrollbar-width:thin}

/* CARDS */
.card{
  background:var(--card);border:1px solid var(--bdr);border-radius:10px;
  padding:13px 10px;min-width:80px;text-align:center;flex-shrink:0;transition:.2s;
  backdrop-filter:blur(8px)
}
.card:hover{border-color:var(--cyan);box-shadow:0 0 16px var(--glow);transform:translateY(-3px)}
.card h3{font-size:.72rem;opacity:.55;font-weight:500;margin-bottom:5px;letter-spacing:.1em;text-transform:uppercase}
.em{font-size:2rem;margin:4px 0}
.rp{font-size:.74rem;color:var(--cyan);margin-top:3px;font-family:var(--mono)}
.wn{font-size:.74rem;color:var(--purple2);margin-top:2px;font-family:var(--mono)}
.uv{font-size:.72rem;margin-top:2px;opacity:.7;font-family:var(--mono)}

/* DAILY */
.dlist{display:flex;flex-direction:column;gap:6px}
.dcrd{
  display:grid;grid-template-columns:80px 2rem 1fr auto auto;
  align-items:center;gap:10px;padding:11px 15px;border-radius:8px;cursor:pointer;
  text-align:left;min-width:unset;transition:.2s;
  background:var(--card);border:1px solid var(--bdr);backdrop-filter:blur(8px)
}
.dcrd:hover{border-color:var(--cyan);box-shadow:0 0 14px var(--glow)}
.dcrd .em{font-size:1.5rem;margin:0}
.dcrd .dday{font-size:.8rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.dcrd .dtemps{font-size:.88rem;white-space:nowrap;font-family:var(--mono)}
.dcrd .drp{font-size:.78rem;color:var(--cyan);font-family:var(--mono)}
.dex{display:none;grid-column:1/-1;margin-top:8px;padding-top:8px;border-top:1px solid var(--bdr);font-size:.8rem;gap:8px;font-family:var(--mono)}
.dcrd.open .dex{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr))}
.dcrd.open{border-color:rgba(124,58,237,.4);box-shadow:0 0 14px var(--glow2)}

/* TEMP CHART */
.chartbox{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:14px 16px 12px;height:170px;position:relative;backdrop-filter:blur(8px)}
.tc{display:flex;align-items:stretch;justify-content:space-around;height:100%;gap:3px}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:0}
.tb-temp{font-size:.65rem;font-weight:600;font-family:var(--mono);color:var(--cyan);line-height:18px;height:18px;white-space:nowrap}
.tb-track{flex:1;width:100%;position:relative}
.tl{position:absolute;bottom:0;left:15%;right:15%;border-radius:2px 2px 0 0}
.td{width:8px;height:8px;background:var(--cyan);border:2px solid var(--bg);border-radius:50%;position:absolute;top:-4px;left:50%;transform:translateX(-50%);box-shadow:0 0 6px var(--cyan)}
.tlb{font-size:.6rem;opacity:.55;line-height:18px;height:18px;white-space:nowrap;font-family:var(--mono);letter-spacing:.02em}

/* RAIN CHART */
.rchart{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:16px 14px 12px;height:160px;backdrop-filter:blur(8px)}
.rbars{display:flex;align-items:stretch;gap:5px;height:100%}
.rbar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:0}
.rbar-pct{font-size:.65rem;font-family:var(--mono);color:var(--cyan);line-height:18px;height:18px}
.rbar-track{flex:1;width:100%;position:relative}
.rbar{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,var(--cyan),rgba(0,212,255,.2));border-radius:3px 3px 0 0;min-height:4px;box-shadow:0 0 6px rgba(0,212,255,.2)}
.rbar-time{font-size:.6rem;font-family:var(--mono);opacity:.5;line-height:18px;height:18px}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:500;padding:20px;backdrop-filter:blur(4px)}
.modal.on{display:flex}
.mbox{
  background:rgba(3,10,25,.97);border:1px solid var(--bdr);border-radius:14px;
  padding:24px;max-width:440px;max-height:80vh;overflow-y:auto;width:100%;animation:pop .25s;
  box-shadow:0 0 40px var(--glow),0 0 80px var(--glow2)
}
.mhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.mhd h2{font-size:1.1rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
.xcl{background:none;border:none;font-size:1.6rem;color:var(--dim);cursor:pointer;width:auto;height:auto;transition:.2s}
.xcl:hover{color:var(--red)}
.sgrp{margin-bottom:18px}
.sgrp h3{font-size:.72rem;opacity:.5;margin-bottom:10px;letter-spacing:.18em;text-transform:uppercase}
.srow2{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bdr)}
.srow2:last-child{border-bottom:none}
.tog{width:44px;height:23px;background:var(--dim);border-radius:2px;cursor:pointer;position:relative;transition:.3s;flex-shrink:0}
.tog.on{background:var(--cyan2)}
.knob{position:absolute;top:2px;left:2px;width:19px;height:19px;background:#fff;border-radius:1px;transition:.3s;box-shadow:0 0 6px rgba(0,212,255,.4)}
.tog.on .knob{transform:translateX(21px)}
.ubtn{padding:5px 13px;border-radius:4px;font-size:.8rem;background:var(--card);border:1px solid var(--bdr);color:var(--text);cursor:pointer;transition:.2s;letter-spacing:.06em;font-family:var(--mono)}
.ubtn.on{background:rgba(0,212,255,.15);border-color:var(--cyan);color:var(--cyan)}
.ubtn:hover{border-color:var(--cyan);box-shadow:0 0 8px var(--glow)}

/* TOAST */
.toast{
  position:fixed;top:18px;right:18px;
  background:rgba(3,10,25,.95);border:1px solid var(--cyan);border-radius:6px;
  padding:10px 16px;z-index:999;
  box-shadow:0 0 20px var(--glow);font-size:.88rem;animation:tostin .3s;
  backdrop-filter:blur(12px);letter-spacing:.06em;color:var(--cyan);font-family:var(--mono)
}
@keyframes tostin{from{transform:translateX(300px);opacity:0}to{transform:none;opacity:1}}

/* ERROR / LOADING */
.loader{text-align:center;padding:40px 20px;display:flex;align-items:center;justify-content:center;gap:10px;letter-spacing:.1em;font-size:.9rem;opacity:.7}
.spin{width:20px;height:20px;border:2px solid var(--bdr);border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.err{text-align:center;padding:30px 20px}
.err p{opacity:.75;line-height:1.7;letter-spacing:.04em}
.rbtn{margin-top:14px;padding:9px 24px;border-radius:4px;font-size:.85rem;background:transparent;border:1px solid var(--cyan);color:var(--cyan);cursor:pointer;letter-spacing:.1em;text-transform:uppercase;font-family:var(--mono);transition:.2s}
.rbtn:hover{background:rgba(0,212,255,.12);box-shadow:0 0 12px var(--glow)}

/* RADAR */
/* RADAR */
.radarbox{background:var(--card);border:1px solid var(--bdr);border-radius:10px;overflow:hidden;position:relative}
#windyframe{width:100%;height:420px;border:none;display:block}

/* PULL TO REFRESH */
#ptr{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:8px;height:0;overflow:hidden;background:rgba(0,212,255,.08);border-bottom:1px solid var(--cyan);color:var(--cyan);font-size:.8rem;letter-spacing:.1em;font-family:var(--mono);transition:height .2s;z-index:200}
#ptr.show{height:48px}
#ptr.spin-it .spin{animation:spin .5s linear infinite}

@media(max-width:580px){h1{font-size:1.2rem}.cur h2{font-size:4rem}.ib{width:36px;height:36px;font-size:1rem}}

/* ── ANIMATIONS ──────────────────────────────────────────────────── */
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* Big temp: clean entrance, NO blinding glow */
.cur h2{animation:pop .7s cubic-bezier(.22,1,.36,1)}

/* Scan sweep: single soft 1px pass */
@keyframes scanline{0%{top:-4px;opacity:0}10%{opacity:1}90%{opacity:.5}100%{top:100%;opacity:0}}
.cur-scan{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 5%,rgba(0,212,255,.3) 50%,transparent 95%);pointer-events:none;animation:scanline 1.8s ease-out 1 forwards}

.cgi{animation:fadeUp .4s ease both}
.card{animation:fadeUp .35s ease both}
.dcrd{animation:fadeUp .3s ease both}

/* ☀️ SUNNY — slow clockwise spin, like the sun tracking the sky */
@keyframes emSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.em-sunny{animation:emSpin 14s linear infinite;display:inline-block}

/* ⛅ CLOUDY — gentle side drift, like clouds drifting on wind */
@keyframes emDrift{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.em-cloudy{animation:emDrift 4s ease-in-out infinite;display:inline-block}

/* 🌧️ RAIN — bounce downward like a falling drop */
@keyframes emDrip{0%,100%{transform:translateY(0)}55%{transform:translateY(7px)}80%{transform:translateY(-2px)}}
.em-rain{animation:emDrip 1.1s ease-in-out infinite;display:inline-block}

/* ❄️ SNOW — slow rotation + gentle fall */
@keyframes emSnow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(5px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
.em-snow{animation:emSnow 3.5s ease-in-out infinite;display:inline-block}

/* ⛈️ STORM — irregular flicker like lightning */
@keyframes emFlash{0%,85%,87%,90%,100%{opacity:1}86%,89%{opacity:.1}}
.em-storm{animation:emFlash 3s ease-in-out infinite;display:inline-block}

/* 🌫️ FOG — slow fade in/out like mist rolling */
@keyframes emFog{0%,100%{opacity:1}50%{opacity:.3}}
.em-fog{animation:emFog 3.5s ease-in-out infinite;display:inline-block}

/* Temp bars: rise upward — temperature climbing */
/* 🔥 Heat mirage — applied to bars ≥80°F (≥26.7°C) */
@keyframes heatMirage{
  0%  {transform:scaleX(1)    skewX(0deg)  brightness(1);   filter:brightness(1)   blur(0px)}
  15% {transform:scaleX(1.02) skewX(.8deg) brightness(1.1); filter:brightness(1.12) blur(.4px)}
  30% {transform:scaleX(.99)  skewX(-.5deg);                filter:brightness(1)   blur(0px)}
  50% {transform:scaleX(1.01) skewX(.6deg);                 filter:brightness(1.08) blur(.3px)}
  65% {transform:scaleX(1)    skewX(0deg);                  filter:brightness(1)   blur(0px)}
  80% {transform:scaleX(1.02) skewX(-.7deg);                filter:brightness(1.1) blur(.35px)}
  100%{transform:scaleX(1)    skewX(0deg);                  filter:brightness(1)   blur(0px)}
}
@keyframes heatHaze{
  0%,100%{opacity:0}
  50%{opacity:.18}
}
.tl-heat{animation:barGrow .8s cubic-bezier(.22,1,.36,1) both, heatMirage 2.2s ease-in-out infinite !important}
.tl-heat::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(to top,rgba(255,120,0,.25),rgba(255,220,80,.12),transparent);animation:heatHaze 1.8s ease-in-out infinite;pointer-events:none}

/* Rain bars: grow from bottom — like rain filling a gauge */
@keyframes rainFill{from{height:0!important;opacity:.3}to{opacity:1}}
.rbar-wrap .rbar{animation:rainFill .75s cubic-bezier(.22,1,.36,1) both}

/* Humidity: slow breathe — moisture expanding and contracting */
@keyframes breathe{0%,100%{opacity:.85;box-shadow:none}50%{opacity:1;box-shadow:0 0 12px rgba(0,212,255,.15)}}
.cgi-humidity{animation:breathe 4s ease-in-out infinite}

/* Wind: subtle horizontal shimmer — air in motion */
@keyframes windShift{0%,100%{transform:translateX(0)}35%{transform:translateX(3px)}65%{transform:translateX(-2px)}}
.cgi-wind{animation:windShift 2.5s ease-in-out infinite}

/* Pressure: slow vertical compress — barometric push */
@keyframes pressurePulse{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.96)}}
.cgi-pressure{animation:pressurePulse 5s ease-in-out infinite;transform-origin:bottom}

/* AQI: pulse red if unhealthy (> 100), subtle if ok */
@keyframes aqiBad{0%,100%{box-shadow:none}50%{box-shadow:0 0 14px rgba(255,51,102,.5);border-color:rgba(255,51,102,.5)}}
.cgi-aqi-warn{animation:aqiBad 2s ease-in-out infinite}

</style>
</head>
<body>
<div id="ptr"><div class="spin"></div><span id="ptr-lbl">Pull to refresh</span></div>
<div class="wrap">

  <header>
    <h1>⚡ ATMOS</h1>
    <div class="hrow">
      <span id="refresh-cd" title="Auto-refreshes every 5 min"></span>
      <button class="ib" id="btheme" title="Toggle theme">🌓</button>
      <button class="ib" id="bset" title="Settings">⚙️</button>
      <button class="ib" id="bgps" title="My location">📍</button>
      <button class="ib" id="bref" title="Refresh">↻</button>
    </div>
  </header>

  <div class="srow">
    <input id="sinput" type="text" placeholder="Search city…" autocomplete="off">
    <button class="ib" id="bsrch">🔍</button>
    <div id="sdrop"></div>
  </div>

  <div id="chips" class="chips"></div>

  <div id="cur" class="cur">
    <div class="loader"><div class="spin"></div>Loading weather…</div>
  </div>

  <section>
    <h2 class="sh">Temperature Trend · Next 12h</h2>
    <div class="chartbox"><div id="tchart" class="tc"></div></div>
  </section>

  <section>
    <h2 class="sh">Next 12 Hours</h2>
    <div id="hourly" class="scroll"></div>
  </section>

  <section>
    <h2 class="sh">Rain Probability · Next 12h</h2>
    <div class="rchart"><div id="rbars" class="rbars"></div></div>
  </section>

  <section>
    <h2 class="sh">Radar</h2>
    <div class="radarbox">
      <iframe id="windyframe"
        src="https://embed.windy.com/embed2.html?lat=35.319&lon=-82.461&detailLat=35.319&detailLon=-82.461&zoom=7&level=surface&overlay=radar&product=radar&menu=&message=&marker=true&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=mph&metricTemp=%C2%B0F&radarRange=-1"
        allowfullscreen>
      </iframe>
    </div>
  </section>

  <section>
    <h2 class="sh">7-Day Forecast <small style="font-size:.8rem;opacity:.6">(tap to expand)</small></h2>
    <div id="daily" class="dlist"></div>
  </section>

</div>

<!-- Settings modal -->
<div id="smod" class="modal">
  <div class="mbox">
    <div class="mhd">
      <h2>⚙️ Settings</h2>
      <button class="xcl" onclick="document.getElementById('smod').classList.remove('on')">×</button>
    </div>
    <div class="sgrp">
      <h3>Temperature</h3>
      <div class="srow2">
        <span>Units</span>
        <div style="display:flex;gap:7px">
          <button class="ubtn on" data-u="f">°F</button>
          <button class="ubtn" data-u="c">°C</button>
        </div>
      </div>
    </div>
    <div class="sgrp">
      <h3>Appearance</h3>
      <div class="srow2">
        <span>Dark mode</span>
        <div class="tog on" id="dtog"><div class="knob"></div></div>
      </div>
    </div>
    <div class="sgrp">
      <h3>Saved locations</h3>
      <div class="srow2">
        <span>Clear all</span>
        <button class="ubtn" id="bclr">Clear</button>
      </div>
    </div>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const DLAT = 35.31873, DLON = -82.46095, DCITY = "Hendersonville, NC";
let lat = DLAT, lon = DLON, city = DCITY;
let units = localStorage.getItem("u") || "f";

// ── HELPERS ───────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const cf = c => units === "f" ? Math.round(c * 9/5 + 32) : Math.round(c);
const tu = () => units === "f" ? "°F" : "°C";

function windDir(deg) {
  const dirs = ["N","NE","E","SE","S","SW","W","NW"];
  return dirs[Math.round(deg / 45) % 8];
}

function localTime(isoStr) {
  // Open-Meteo returns local ISO strings like "2024-05-27T06:23" — no Z suffix.
  // Appending nothing keeps them local; just format directly.
  const [date, time] = isoStr.split("T");
  const [h, m] = time.split(":").map(Number);
  const ampm = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2,"0")} ${ampm}`;
}

function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

// emoji animation class based on weather code
function emClass(code) {
  if (code === 0) return "em-sunny";
  if ([45,48].includes(code)) return "em-fog";
  if ([1,2,3].includes(code)) return "em-cloudy";
  if ([51,53,55,61,63,65,80,81,82].includes(code)) return "em-rain";
  if ([71,73,75].includes(code)) return "em-snow";
  if ([95,96,99].includes(code)) return "em-storm";
  return "em-cloudy";
}
const EM = {0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌦️",53:"🌦️",55:"🌧️",61:"🌧️",63:"🌧️",65:"🌧️",71:"❄️",73:"❄️",75:"❄️",80:"🌦️",81:"🌧️",82:"⛈️",95:"⛈️",96:"⛈️",99:"⛈️"};
const WD = {0:"Clear sky",1:"Mainly clear",2:"Partly cloudy",3:"Overcast",45:"Foggy",48:"Rime fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",71:"Light snow",73:"Snow",75:"Heavy snow",80:"Rain showers",81:"Heavy showers",82:"Violent showers",95:"Thunderstorm",96:"Thunderstorm + hail",99:"Heavy thunderstorm"};
const BG = c => {
  if (c===0) return "radial-gradient(ellipse at 25% 20%,#fde68a 0%,#f59e0b 60%,#d97706 100%)";
  if ([1,2].includes(c)) return "linear-gradient(145deg,#60a5fa,#3b82f6)";
  if (c===3) return "linear-gradient(145deg,#94a3b8,#64748b)";
  if ([51,53,55,61,63,65,80,81,82].includes(c)) return "linear-gradient(145deg,#0ea5e9,#0369a1)";
  if ([71,73,75].includes(c)) return "linear-gradient(145deg,#bae6fd,#7dd3fc,#38bdf8)";
  if ([95,96,99].includes(c)) return "linear-gradient(145deg,#6366f1,#4338ca)";
  return "linear-gradient(145deg,#94a3b8,#64748b)";
};

// ── SAVED LOCATIONS ───────────────────────────────────────────────────────────
const getLocs = () => { try { return JSON.parse(localStorage.getItem("locs") || "[]"); } catch { return []; } };
const saveLocs = l => localStorage.setItem("locs", JSON.stringify(l));
const isSaved = (a,o) => getLocs().some(x => Math.abs(x.lat-a)<0.02 && Math.abs(x.lon-o)<0.02);

function toggleStar() {
  const saved = isSaved(lat, lon);
  if (saved) {
    saveLocs(getLocs().filter(x => !(Math.abs(x.lat-lat)<0.02 && Math.abs(x.lon-lon)<0.02)));
    toast("Removed");
  } else {
    const l = getLocs(); l.push({city, lat, lon}); saveLocs(l);
    toast("Saved ⭐");
  }
  renderChips();
  const s = document.querySelector(".star");
  if (s) s.textContent = isSaved(lat, lon) ? "⭐" : "☆";
}

function renderChips() {
  const locs = getLocs();
  const el = $("chips");
  el.innerHTML = "";
  if (!locs.length) return;
  locs.forEach(l => {
    const div = document.createElement("div");
    div.className = "chip" + (Math.abs(l.lat - lat) < 0.02 && Math.abs(l.lon - lon) < 0.02 ? " on" : "");
    div.innerHTML = `📍 ${l.city} <span class="xbtn">×</span>`;
    div.addEventListener("click", () => go(l.lat, l.lon, l.city));
    const xbtn = div.querySelector(".xbtn");
    if (xbtn) xbtn.addEventListener("click", e => { e.stopPropagation(); rmLoc(l.lat, l.lon); });
    el.appendChild(div);
  });
}

function rmLoc(a,o) {
  saveLocs(getLocs().filter(x => !(Math.abs(x.lat-a)<0.02 && Math.abs(x.lon-o)<0.02)));
  renderChips();
}

// ── API ────────────────────────────────────────────────────────────────────────
async function fetchWeather(a, o) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${a}&longitude=${o}`
    + `&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m,surface_pressure,wind_speed_10m,wind_direction_10m`
    + `&hourly=temperature_2m,apparent_temperature,weather_code,precipitation_probability,wind_speed_10m,uv_index`
    + `&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max`
    + `&wind_speed_unit=mph&timezone=auto`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

async function fetchAQI(a, o) {
  try {
    const r = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${a}&longitude=${o}&current=us_aqi`);
    if (!r.ok) return null;
    const d = await r.json();
    return d.current?.us_aqi ?? null;
  } catch { return null; }
}

async function fetchGeo(q) {
  const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=en&format=json`);
  if (!r.ok) throw new Error("Geocoding failed");
  return r.json();
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderCurrent(d, aqi) {
  const c = d.current, dy = d.daily;
  const el = $("cur");
  el.innerHTML = `

    <div class="cur-scan"></div>
    <h2 id="cur-temp">${cf(c.temperature_2m)}${tu()}</h2>
    <div class="cloc">
      <strong>${city}</strong>
      <span class="star" onclick="toggleStar()" title="Save location">${isSaved(lat,lon)?"⭐":"☆"}</span>
    </div>
    <div class="cdesc"><span class="${emClass(c.weather_code)}">${EM[c.weather_code]||"🌥️"}</span> ${WD[c.weather_code]||""}</div>
    <div style="opacity:.65;margin-top:4px;font-family:var(--mono);font-size:.85rem;letter-spacing:.06em">FEELS LIKE ${cf(c.apparent_temperature)}${tu()}</div>
    <div class="cgrid">
      <div class="cgi cgi-humidity" style="animation-delay:.1s">💧 Humidity<strong>${Math.round(c.relative_humidity_2m)}%</strong></div>
      <div class="cgi cgi-wind" style="animation-delay:.18s">💨 Wind<strong>${Math.round(c.wind_speed_10m)} mph ${windDir(c.wind_direction_10m)}</strong></div>
      <div class="cgi cgi-pressure" style="animation-delay:.26s">📊 Pressure<strong>${Math.round(c.surface_pressure)} mb</strong></div>
      ${aqi != null ? `<div class="cgi ${aqi > 100 ? "cgi-aqi-warn" : ""}" style="animation-delay:.34s">🌫️ AQI<strong>${aqi}</strong></div>` : ""}
    </div>
    <div class="sunrow">
      🌅 ${localTime(dy.sunrise[0])}
      &nbsp;&nbsp;
      🌇 ${localTime(dy.sunset[0])}
    </div>`;

  // White(cold) → Blue(medium) → Yellow(hot) based on raw °C value
  function tempCardColor(celsius, alpha) {
    const norm = Math.max(0, Math.min(1, (celsius - (-29)) / (38 - (-29))));
    let r, g, b;
    if (norm <= 0.5) {
      const t = norm * 2;
      r = Math.round(255 + (50  - 255) * t);
      g = Math.round(255 + (130 - 255) * t);
      b = 255;
    } else {
      const t = (norm - 0.5) * 2;
      r = Math.round(50  + (255 - 50)  * t);
      g = Math.round(130 + (220 - 130) * t);
      b = Math.round(255 + (0   - 255) * t);
    }
    return `rgba(${r},${g},${b},${alpha})`;
  }
  const tc = c.temperature_2m;
  el.style.background = `linear-gradient(160deg, ${tempCardColor(tc, 0.18)} 0%, ${tempCardColor(tc, 0.07)} 50%, rgba(3,5,15,0.6) 100%)`;
  el.style.borderColor = tempCardColor(tc, 0.55);
  el.style.boxShadow = `0 0 32px ${tempCardColor(tc, 0.25)}, 0 0 80px ${tempCardColor(tc, 0.1)}, inset 0 0 40px ${tempCardColor(tc, 0.06)}`;

  // count-up animation on the big temperature (text stays white)
  const target = cf(c.temperature_2m);
  const unit = tu();
  const h2 = $("cur-temp");
  h2.style.color = "";
  h2.style.textShadow = "";
  const start = Math.round(target * 0.4);
  const duration = 900, startTime = performance.now();
  function countUp(now) {
    const t = Math.min((now - startTime) / duration, 1);
    const ease = 1 - Math.pow(1 - t, 3);
    h2.textContent = Math.round(start + (target - start) * ease) + unit;
    if (t < 1) requestAnimationFrame(countUp);
  }
  requestAnimationFrame(countUp);
}

function renderTempChart(d) {
  const el = $("tchart"); el.innerHTML = "";
  const now = new Date(), times = d.hourly.time || [];
  let s = times.findIndex(t => new Date(t) >= now); if (s < 0) s = 0;
  const slice = Array.from({length:12}, (_,i) => ({
    t: d.hourly.temperature_2m?.[s+i],
    time: times[s+i]
  })).filter(x => x.t != null);

  if (slice.length === 0) return;

  const mn = Math.min(...slice.map(x=>x.t)), mx = Math.max(...slice.map(x=>x.t)), rng = mx-mn||1;
  slice.forEach((x,i) => {
    const norm = (x.t - mn) / rng; // 0 = coldest, 1 = hottest
    const hue = Math.round(200 + norm * 160); // 200=blue → 280=purple → 360=red
    const barColor = `hsl(${hue},80%,58%)`;
    const barTop   = `hsl(${hue},60%,72%)`;
    const h = norm * 65 + 18;
    const parts = (x.time||"").split("T");
    let lbl = "Now";
    if (i > 0 && parts[1]) {
      const [hh] = parts[1].split(":").map(Number);
      const ampm = hh < 12 ? "AM" : "PM";
      lbl = `${hh % 12 || 12}${ampm}`;
    }
    const col = document.createElement("div"); col.className = "tb";
    const tempEl = document.createElement("span"); tempEl.className = "tb-temp";
    tempEl.style.cssText = `color:${barColor};opacity:0;animation:fadeUp .4s ease ${i*55}ms both`;
    tempEl.textContent = `${cf(x.t)}${tu()}`;
    const track = document.createElement("div"); track.className = "tb-track";
    const isHot = x.t >= 26.7; // ≥80°F
    const bar = document.createElement("div"); bar.className = isHot ? "tl tl-heat" : "tl";
    bar.style.cssText = `height:${h}%;animation-delay:${i*55}ms;background:linear-gradient(to top,${barColor},${barTop});box-shadow:0 0 ${isHot ? "16px" : "8px"} ${barColor}${isHot ? "cc" : "66"}`;
    track.appendChild(bar);
    const timeLbl = document.createElement("span"); timeLbl.className = "tlb";
    timeLbl.style.cssText = `opacity:0;animation:fadeUp .4s ease ${i*55+200}ms both`;
    timeLbl.textContent = lbl;
    col.appendChild(tempEl); col.appendChild(track); col.appendChild(timeLbl);
    el.appendChild(col);
  });
}

function renderHourly(d) {
  const el = $("hourly"); el.innerHTML = "";
  const now = new Date(), times = d.hourly.time || [];
  let s = times.findIndex(t => new Date(t) >= now); if (s < 0) s = 0;
  for (let i = 0; i < 12; i++) {
    const idx = s+i; if (idx >= times.length) break;
    const lbl = i===0 ? "Now" : new Date(times[idx]).toLocaleTimeString([],{hour:"numeric"});
    const uv = Math.round(d.hourly.uv_index?.[idx]||0);
    const div = document.createElement("div"); div.className = "card";
    div.style.animationDelay = `${i * 50}ms`;
    div.innerHTML = `<h3>${lbl}</h3>
      <div class="${emClass(d.hourly.weather_code[idx])}">${EM[d.hourly.weather_code[idx]]||"🌥️"}</div>
      <p><strong>${cf(d.hourly.temperature_2m[idx])}${tu()}</strong></p>
      <div class="rp" style="color:var(--dim)">Feels ${cf(d.hourly.apparent_temperature?.[idx] ?? d.hourly.temperature_2m[idx])}°</div>
      <div class="rp">${d.hourly.precipitation_probability[idx]||0}% 💧</div>
      <div class="wn">💨 ${Math.round(d.hourly.wind_speed_10m[idx]||0)} mph</div>
      ${uv > 0 ? `<div class="uv">☀️ UV ${uv}</div>` : ""}`;
    el.appendChild(div);
  }
}

function renderRain(d) {
  const el = $("rbars"); el.innerHTML = "";
  const now = new Date(), times = d.hourly.time || [];
  let s = times.findIndex(t => new Date(t) >= now); if (s < 0) s = 0;
  for (let i = 0; i < 12; i++) {
    const idx = s+i; if (idx >= (d.hourly.precipitation_probability||[]).length) break;
    const prob = d.hourly.precipitation_probability[idx]||0;
    // parse "YYYY-MM-DDTHH:MM" → "H AM/PM"
    const parts = (times[idx]||"").split("T");
    let timeLbl = "";
    if (parts[1]) {
      const [hh,mm] = parts[1].split(":").map(Number);
      const ampm = hh < 12 ? "AM" : "PM";
      const h = hh % 12 || 12;
      timeLbl = `${h}${ampm}`;
    }
    const wrap = document.createElement("div"); wrap.className = "rbar-wrap";
    const pct = document.createElement("span"); pct.className = "rbar-pct"; pct.textContent = `${prob}%`;
    const track = document.createElement("div"); track.className = "rbar-track";
    const b = document.createElement("div"); b.className = "rbar";
    b.style.cssText = `height:${Math.max(prob,3)}%;animation-delay:${i*45}ms`;
    const time = document.createElement("span"); time.className = "rbar-time"; time.textContent = timeLbl;
    track.appendChild(b);
    wrap.appendChild(pct); wrap.appendChild(track); wrap.appendChild(time);
    el.appendChild(wrap);
  }
}

function renderDaily(d) {
  const el = $("daily"); el.innerHTML = "";
  const times = d.daily.time || [];
  times.forEach((dt, i) => {
    const day = i===0 ? "Today" : new Date(dt + "T12:00:00").toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"});
    const card = document.createElement("div"); card.className = "card dcrd";
    card.style.animationDelay = `${i * 60}ms`;
    card.innerHTML = `
      <div class="dday">${day}</div>
      <div class="${emClass(d.daily.weather_code[i])}">${EM[d.daily.weather_code[i]]||"🌥️"}</div>
      <div style="font-size:.82rem;opacity:.75">${WD[d.daily.weather_code[i]]||""}</div>
      <div class="dtemps"><strong>${cf(d.daily.temperature_2m_max[i])}°</strong> / ${cf(d.daily.temperature_2m_min[i])}°</div>
      <div class="drp">${d.daily.precipitation_probability_max[i]||0}% 💧</div>
      <div class="dex">
        <div><strong>UV:</strong> ${d.daily.uv_index_max?.[i]||0}</div>
        <div>🌅 ${localTime(d.daily.sunrise[i])}</div>
        <div>🌇 ${localTime(d.daily.sunset[i])}</div>
      </div>`;
    card.onclick = () => card.classList.toggle("open");
    el.appendChild(card);
  });
}

// ── MAIN LOAD ─────────────────────────────────────────────────────────────────
async function go(a, o, c) {
  lat = a; lon = o; city = c || "Unknown Location";
  $("cur").innerHTML = `<div class="loader"><div class="spin"></div>Loading ${city}…</div>`;
  try {
    const [weather, aqi] = await Promise.all([
      fetchWeather(a, o),
      fetchAQI(a, o)
    ]);
    renderCurrent(weather, aqi);
    renderTempChart(weather);
    renderHourly(weather);
    renderRain(weather);
    renderDaily(weather);
    renderChips();
    updateWindy();
  } catch (e) {
    console.error("Weather load error:", e);
    $("cur").innerHTML = `
      <div class="err">
        <p>⚠️ Could not load weather data.<br>
        Check your internet connection.</p>
        <button class="rbtn" id="retry-btn">Try again</button>
      </div>`;
    $("retry-btn").addEventListener("click", () => go(a, o, c));
  }
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
let stmr;

function renderDrop(results) {
  const drop = $("sdrop");
  drop.innerHTML = "";
  if (!results || results.length === 0) {
    drop.innerHTML = `<div class="si">No results found</div>`;
    drop.style.display = "block";
    return;
  }
  results.forEach(r => {
    const parts = [r.name, r.admin1, r.country].filter(Boolean);
    const div = document.createElement("div");
    div.className = "si";
    div.innerHTML = `<strong>${r.name}</strong>${r.admin1 ? ", " + r.admin1 : ""}, ${r.country || ""}
      <br><small>${r.latitude.toFixed(2)}, ${r.longitude.toFixed(2)}</small>`;
    div.addEventListener("click", () => {
      $("sdrop").style.display = "none";
      $("sinput").value = "";
      go(r.latitude, r.longitude, parts.join(", "));
    });
    drop.appendChild(div);
  });
  drop.style.display = "block";
}

async function doSearch() {
  const q = $("sinput").value.trim();
  if (q.length < 2) {
    $("sdrop").style.display = "none";
    return;
  }
  try {
    const d = await fetchGeo(q);
    renderDrop(d.results);
  } catch(e) {
    console.error("Search error:", e);
    $("sdrop").innerHTML = `<div class="si">Search unavailable — check connection</div>`;
    $("sdrop").style.display = "block";
  }
}

$("sinput").addEventListener("input", () => {
  clearTimeout(stmr);
  stmr = setTimeout(doSearch, 350);
});
$("sinput").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    clearTimeout(stmr);
    doSearch();
  }
});
$("bsrch").onclick = () => { clearTimeout(stmr); doSearch(); };

document.addEventListener("click", e => {
  if (!e.target.closest(".srow")) $("sdrop").style.display = "none";
});

// ── SETTINGS & OTHER UI ─────────────────────────────────────────────────────
$("bset").onclick = () => $("smod").classList.add("on");

document.querySelectorAll("[data-u]").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("[data-u]").forEach(b => b.classList.toggle("on", b.dataset.u === btn.dataset.u));
    units = btn.dataset.u;
    localStorage.setItem("u", units);
    go(lat, lon, city);
  };
});

$("dtog").onclick = function() {
  this.classList.toggle("on");
  document.body.classList.toggle("light", !this.classList.contains("on"));
  localStorage.setItem("dark", this.classList.contains("on") ? "1" : "0");
};

$("btheme").onclick = () => {
  const tog = $("dtog");
  tog.classList.toggle("on");
  document.body.classList.toggle("light", !tog.classList.contains("on"));
  localStorage.setItem("dark", tog.classList.contains("on") ? "1" : "0");
  toast(tog.classList.contains("on") ? "Dark mode" : "Light mode");
};

$("bclr").onclick = () => {
  if (confirm("Clear all saved locations?")) {
    localStorage.removeItem("locs");
    renderChips();
    toast("Cleared");
  }
};

$("bgps").onclick = () => {
  if (!navigator.geolocation) { toast("Geolocation not supported"); return; }
  toast("Getting location…");
  navigator.geolocation.getCurrentPosition(
    p => go(p.coords.latitude, p.coords.longitude, "My Location"),
    () => toast("Location access denied")
  );
};

$("bref").onclick = () => go(lat, lon, city);

// ── RADAR (Windy embed) ───────────────────────────────────────────────────────
function updateWindy() {
  const f = $("windyframe");
  if (!f) return;
  f.src = `https://embed.windy.com/embed2.html?lat=${lat}&lon=${lon}&detailLat=${lat}&detailLon=${lon}&zoom=7&level=surface&overlay=radar&product=radar&menu=&message=&marker=true&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=mph&metricTemp=%C2%B0F&radarRange=-1`;
}

// ── PULL TO REFRESH ──────────────────────────────────────────────────────────
(() => {
  let startY = 0, pulling = false, triggered = false;
  const ptr = $("ptr"), lbl = $("ptr-lbl");
  const THRESHOLD = 72;

  document.addEventListener("touchstart", e => {
    if (window.scrollY === 0) { startY = e.touches[0].clientY; pulling = true; triggered = false; }
  }, {passive:true});

  document.addEventListener("touchmove", e => {
    if (!pulling) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 10 && window.scrollY === 0) {
      ptr.classList.add("show");
      lbl.textContent = dy >= THRESHOLD ? "Release to refresh" : "Pull to refresh";
      if (dy >= THRESHOLD) triggered = true;
    }
  }, {passive:true});

  document.addEventListener("touchend", () => {
    if (!pulling) return;
    pulling = false;
    if (triggered) {
      lbl.textContent = "Refreshing…";
      ptr.classList.add("spin-it");
      go(lat, lon, city).finally(() => {
        ptr.classList.remove("show","spin-it");
      });
    } else {
      ptr.classList.remove("show");
    }
    triggered = false;
  });
})();

// ── INIT ─────────────────────────────────────────────────────────────────────
(() => {
  const dark = localStorage.getItem("dark");
  if (dark === "0") { 
    document.body.classList.add("light"); 
    $("dtog").classList.remove("on"); 
  }
  if (units === "c") {
    document.querySelectorAll("[data-u]").forEach(b => b.classList.toggle("on", b.dataset.u === "c"));
  }
  renderChips();
  go(DLAT, DLON, DCITY);

  // ── AUTO-REFRESH every 5 minutes ──────────────────────────────────
  const REFRESH_MS = 5 * 60 * 1000;
  let refreshAt = Date.now() + REFRESH_MS;
  const cdEl = document.getElementById("refresh-cd");

  function updateCountdown() {
    const secsLeft = Math.max(0, Math.round((refreshAt - Date.now()) / 1000));
    const m = Math.floor(secsLeft / 60);
    const s = String(secsLeft % 60).padStart(2, "0");
    cdEl.textContent = `refresh in ${m}:${s}`;
    cdEl.classList.toggle("soon", secsLeft <= 60);
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);

  setInterval(() => {
    refreshAt = Date.now() + REFRESH_MS;
    go(lat, lon, city);
  }, REFRESH_MS);
})();
</script>
